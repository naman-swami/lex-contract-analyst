annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Segment legal agreements into categorized contract clauses.
input_schema:
  additionalProperties: false
  properties:
    clause_categories:
      type: string
    contract_text:
      type: string
  required:
  - contract_text
  type: object
name: extract-clauses
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
